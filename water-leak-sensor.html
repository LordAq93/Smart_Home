<style>
:root{--petrol:#0E2A2B;--deep:#071A1B;--cool:#4FB8A8;--cool-dim:#2E7A70;--mist:#E8F1EE;--slate:#7E9895;--amber:#E8A33D;--line:rgba(232,241,238,.14);
--display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;--body:'IBM Plex Sans Arabic',system-ui,-apple-system,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace}
html[dir=rtl] h1,html[dir=rtl] h2,html[dir=rtl] h3,html[dir=rtl] .brand{font-family:var(--body);font-weight:600;letter-spacing:0}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--petrol);color:var(--mist);font-family:var(--body);font-weight:300;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;padding-bottom:78px}
.wrap{max-width:1140px;margin:0 auto;padding:0 24px}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.04;letter-spacing:-.035em}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:2px solid var(--cool);outline-offset:3px;border-radius:3px}
.hidden{display:none!important}
.nav{position:sticky;top:0;z-index:60;background:rgba(14,42,43,.85);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;justify-content:space-between;height:64px;gap:20px}
.brand{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.04em}
.brand span{color:var(--cool)}
.links{display:flex;gap:26px;font-size:14.5px;color:var(--slate)}
.links a:hover,.links a.on{color:var(--mist)}
.nav-right{display:flex;align-items:center;gap:14px}
.lang{font-family:var(--mono);font-size:12px;border:1px solid var(--line);padding:7px 13px;border-radius:999px;color:var(--slate)}
.cartbtn{font-family:var(--mono);font-size:13px;display:flex;align-items:center;gap:7px}
.badge{background:var(--cool);color:var(--deep);border-radius:999px;min-width:19px;height:19px;font-size:11px;display:grid;place-items:center;font-weight:500}
@media(max-width:860px){.links{display:none}}

.crumb{font-family:var(--mono);font-size:11.5px;color:var(--slate);padding:26px 0;letter-spacing:.05em}
html[dir=rtl] .crumb{letter-spacing:0}
.crumb a:hover{color:var(--mist)}
.pdp{display:grid;grid-template-columns:1.05fr 1fr;gap:58px;align-items:start;padding-bottom:70px}
.stage{background:var(--deep);border:1px solid var(--line);border-radius:20px;aspect-ratio:1/1;display:grid;place-items:center;position:relative;overflow:hidden}
.stage img{width:96%;height:96%;object-fit:contain}
.ph-tag{position:absolute;inset-block-start:14px;inset-inline-start:14px;font-family:var(--mono);font-size:10px;color:var(--slate);border:1px dashed var(--line);padding:5px 9px;border-radius:6px}
.thumbs{display:flex;gap:10px;margin-top:12px}
.thumb{flex:1;aspect-ratio:1/1;background:var(--deep);border:1px solid var(--line);border-radius:11px;display:grid;place-items:center;color:var(--slate);font-family:var(--mono);font-size:10px;transition:.2s}
.thumb:hover,.thumb[aria-pressed=true]{border-color:var(--cool-dim);color:var(--cool)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--cool)}
html[dir=rtl] .eyebrow{letter-spacing:0}
.pdp h1{font-size:clamp(29px,3.9vw,44px);margin:14px 0 14px}
.blurb{color:var(--slate);font-size:16.5px;max-width:46ch}
.pricerow{display:flex;align-items:baseline;gap:12px;margin:26px 0 6px;flex-wrap:wrap}
.big{font-family:var(--mono);font-weight:500;font-size:36px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.was{font-family:var(--mono);font-size:16px;color:var(--slate);text-decoration:line-through}
.tag{background:rgba(232,163,61,.15);color:var(--amber);font-family:var(--mono);font-size:11px;padding:4px 9px;border-radius:5px}
.vatline{font-family:var(--mono);font-size:11.5px;color:var(--slate);margin-bottom:26px}
.opt{margin-bottom:22px}
.optgroup+.optgroup{margin-block-start:16px}
.optlabel{font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--slate);margin-bottom:10px;display:flex;justify-content:space-between;gap:14px}
html[dir=rtl] .optlabel{letter-spacing:0}
.optlabel span:last-child{color:var(--mist);text-transform:none;letter-spacing:0}
.chips{display:flex;gap:9px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:10px;padding:11px 16px;font-size:14px;color:var(--slate);transition:.18s}
.chip:hover{border-color:var(--cool-dim)}
.chip[aria-pressed=true]{border-color:var(--cool);color:var(--mist);background:rgba(79,184,168,.1)}
.chip small{display:block;font-family:var(--mono);font-size:11px;color:var(--cool);margin-top:3px}
.qtyrow{display:flex;gap:12px;margin:26px 0 12px}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.qty button{width:46px;height:100%;font-size:19px;color:var(--slate)}
.qty button:hover{color:var(--mist)}
.qty span{width:38px;text-align:center;font-family:var(--mono);font-size:16px}
.buy{flex:1;background:var(--cool);color:var(--deep);font-weight:600;font-size:16px;border-radius:12px;padding:17px;transition:.18s}
.buy:hover{background:var(--mist)}
.buynow{width:100%;border:1px solid var(--line);border-radius:12px;padding:15px;font-size:15px;transition:.18s}
.buynow:hover{border-color:var(--cool-dim)}
.reassure{display:flex;gap:18px;flex-wrap:wrap;margin-top:20px;font-family:var(--mono);font-size:11.5px;color:var(--slate)}
.reassure b{color:var(--cool);font-weight:400}
.demo{background:var(--deep);border:1px solid var(--line);border-radius:18px;padding:26px;margin-top:30px}
.demo-h{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate);margin-bottom:18px}
html[dir=rtl] .demo-h{letter-spacing:0}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:230px;margin:0 auto}
.keypad button{aspect-ratio:1.5/1;border:1px solid var(--line);border-radius:11px;font-family:var(--mono);font-size:17px}
.keypad button:active{background:var(--cool);color:var(--deep)}
.codeline{text-align:center;font-family:var(--mono);font-size:26px;letter-spacing:.4em;margin-bottom:16px;min-height:34px;color:var(--cool)}
.codemsg{text-align:center;font-size:13.5px;color:var(--slate);margin-top:16px;min-height:40px}
.codemsg b{color:var(--cool);font-weight:500}
.meter-out{display:flex;align-items:flex-end;gap:9px;margin-top:18px}
.meter-out .v{font-family:var(--mono);font-size:38px;color:var(--amber);font-variant-numeric:tabular-nums;line-height:1}
.meter-out .u{font-family:var(--mono);font-size:13px;color:var(--slate);padding-bottom:5px}
.meter-note{font-size:13.5px;color:var(--slate);margin-top:10px}
section{padding:66px 0;border-top:1px solid var(--line)}
.sec-h{font-size:clamp(23px,2.9vw,32px);margin-bottom:32px}
.spec{display:grid;grid-template-columns:1fr 1fr;gap:0 56px}
.spec>div{display:flex;justify-content:space-between;gap:20px;padding:15px 0;border-bottom:1px solid var(--line);font-size:15px}
.spec dt{color:var(--slate)}
.spec dd{font-family:var(--mono);font-size:13.5px;text-align:end}
.faq details{border-bottom:1px solid var(--line);padding:20px 0}
.faq summary{cursor:pointer;font-size:17px;list-style:none;display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-family:var(--mono);color:var(--cool)}
.faq details[open] summary::after{content:"−"}
.faq p{color:var(--slate);font-size:15px;margin-top:12px;max-width:72ch}
.rel{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.pcard{background:var(--deep);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:9px;transition:border-color .2s,transform .2s}
.pcard:hover{border-color:var(--cool-dim);transform:translateY(-3px)}
.pcard .g{font-size:24px;color:var(--cool)}
.pcard h3{font-size:17px}
.pcard p{font-size:14px;color:var(--slate);flex:1}
.prow{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.price{font-family:var(--mono);font-size:16px;color:var(--cool)}

footer{padding:44px 0;border-top:1px solid var(--line);font-family:var(--mono);font-size:12px;color:var(--slate);display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap}
.sticky{position:fixed;inset-block-end:0;inset-inline:0;z-index:70;background:rgba(7,26,27,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);transform:translateY(110%);transition:transform .3s}
.sticky.show{transform:translateY(0)}
.sticky-in{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 24px;max-width:1140px;margin:0 auto}
.sticky-l{font-size:14px}
.sticky-l span{font-family:var(--mono);color:var(--cool);display:block;font-size:13px}
.sticky .buy{flex:0 0 auto;padding:13px 30px}
.overlay{position:fixed;inset:0;background:rgba(3,14,15,.8);z-index:100;display:none;place-items:center;padding:24px}
.overlay.show{display:grid}
.modal{background:var(--petrol);border:1px solid var(--line);border-radius:20px;max-width:470px;width:100%;padding:34px;max-height:90vh;overflow-y:auto}
.modal h3{font-size:25px;margin-bottom:12px}
.modal p{color:var(--slate);font-size:15px;margin-bottom:22px}
.modal input,.modal select{width:100%;background:var(--deep);border:1px solid var(--line);border-radius:10px;padding:13px 15px;color:var(--mist);font-family:var(--body);font-size:16px;margin-bottom:12px}
.modal input::placeholder{color:var(--slate);opacity:.6}
.modal .buy{width:100%;margin-top:6px}
.dismiss{display:block;width:100%;text-align:center;font-family:var(--mono);font-size:12px;color:var(--slate);margin-top:16px}
.cartline{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;font-size:15px;padding:13px 0;border-bottom:1px solid var(--line);color:var(--slate)}
.cartline b{color:var(--mist);font-weight:400}
.cl-main{flex:1;min-width:0}
.cl-var{display:block;font-size:13px;color:var(--slate);margin-block-start:3px;line-height:1.35}
.cl-amt{white-space:nowrap}
.cl-qty{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:8px;padding:2px 6px}
.cl-qty button{color:var(--slate);font-size:15px;line-height:1;padding:2px 3px}
.cl-qty button:hover{color:var(--cool)}
.cl-qty span{font-family:var(--mono);font-size:13px;min-width:14px;text-align:center;color:var(--mist)}
.cl-rm{color:var(--slate);font-size:17px;line-height:1;padding:2px 4px}
.cl-rm:hover{color:var(--amber)}
.cartfee{display:flex;justify-content:space-between;gap:14px;font-size:14px;padding:12px 0;color:var(--slate)}
.panel-btn{position:fixed;inset-block-end:86px;inset-inline-end:20px;z-index:75;background:var(--amber);color:var(--deep);font-family:var(--mono);font-size:12px;font-weight:500;padding:11px 16px;border-radius:999px;box-shadow:0 8px 26px rgba(0,0,0,.45)}
.panel{position:fixed;inset-block:0;inset-inline-end:0;width:min(360px,100%);z-index:110;background:var(--deep);border-inline-start:1px solid var(--line);transform:translateX(105%);transition:transform .3s;display:flex;flex-direction:column}
html[dir=rtl] .panel{transform:translateX(-105%)}
.panel.open{transform:translateX(0)}
.panel-head{padding:20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;font-family:var(--mono);font-size:13px}
.panel-body{padding:20px;overflow-y:auto;flex:1}
.funnel>div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(232,241,238,.07);font-family:var(--mono);font-size:12px;color:var(--slate)}
.funnel .hit{color:var(--cool)}
.log{font-family:var(--mono);font-size:11.5px;margin-top:20px}
.log div{display:flex;gap:9px;padding:6px 0;border-bottom:1px solid rgba(232,241,238,.07);color:var(--slate)}
.log .t{color:var(--cool-dim)}
.log .e{color:var(--mist)}
.panel-foot{padding:16px 20px;border-top:1px solid var(--line);font-family:var(--mono);font-size:10.5px;color:var(--slate);line-height:1.75}
@media(max-width:900px){.pdp{grid-template-columns:1fr;gap:34px}.spec{grid-template-columns:1fr}.rel{grid-template-columns:1fr}section{padding:50px 0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>



const APPLIANCES=[
 {en:'Deep freezer',ar:'فريزر',w:150,duty:1,note:{en:'Runs all day, all year. Usually the quiet one.',ar:'يعمل طوال اليوم وطوال السنة، وهو عادةً الصامت.'}},
 {en:'Window AC',ar:'مكيف شباك',w:1200,duty:0.33,note:{en:'Eight hours a night in July. This is where the money goes.',ar:'ثماني ساعات كل ليلة في يوليو، وهنا تذهب النفقات.'}},
 {en:'Water cooler',ar:'برّاد ماء',w:90,duty:0.4,note:{en:'Small, but it never turns off.',ar:'صغير، لكنه لا ينطفئ أبداً.'}},
 {en:'Washing machine',ar:'غسالة',w:500,duty:0.06,note:{en:'Loud, but cheap to run.',ar:'صوتها مرتفع، لكن تشغيلها رخيص.'}}];

/* ---------- state ---------- */

let P=CATALOG.find(p=>p.id==='leak');
let lang=SiteLang.saved(),qty=1,cart=[],appl=0,code='';
const FUNNEL=['view_item','variant_select','demo_used','add_to_cart','begin_checkout','intent_captured'];
const hits=new Set();

/* Tell the shared analytics file which page this is and which product
   it is about, so that every event it records carries both. */
Analytics.page='pdp';
Analytics.product=P.id;

/* The shared file calls this after each event. Ticking off the funnel
   is this page's own business, so it stays here. */
window.onTrack=function(record){
 if(FUNNEL.includes(record.event)){hits.add(record.event);drawFunnel();}
};
function drawFunnel(){document.getElementById('funnel').innerHTML=FUNNEL.map(f=>
 '<div class="'+(hits.has(f)?'hit':'')+'"><span>'+f+'</span><span>'+(hits.has(f)?'✓':'—')+'</span></div>').join('');}
document.getElementById('srcLine').textContent='source: '+Analytics.source;
const T=(o)=>lang==='ar'?o.ar:o.en;

/* One chosen item per option group. picks[0] is the choice in the
   first group, picks[1] in the second, and so on. */
let picks=[];
function chosen(){return P.opts.map((g,i)=>g.items[picks[i]||0]);}

function unitPrice(){
 /* A group may set its own price - placement does, finish does not.
    If more than one names a price, the last one wins. */
 let price=P.price;
 chosen().forEach(it=>{if(it&&it.price)price=it.price;});
 return price;
}
function render(){
 const L=lang;
 document.title=P[L][0]+' — Bayt Control';
 document.getElementById('crumb').innerHTML=
  '<a href="index.html">'+(L==='ar'?'الرئيسية':'HOME')+'</a> / <a href="products.html?c='+P.c+'">'+CATNAME[P.c][L]+'</a> / '+P[L][0];
 const shot=document.getElementById('shot');
 shot.src=P.img;
 /* Read aloud to blind visitors, and shown if the file fails to load. */
 shot.alt=P[L][0];
 document.getElementById('pCat').textContent=CATNAME[P.c][L];
 document.getElementById('pTitle').textContent=P[L][0];
 document.getElementById('pBlurb').textContent=P[L][2];
 document.getElementById('pPrice').textContent=unitPrice().toLocaleString('en-US');
 const w=document.getElementById('pWas');
 /* Only show the old price when the chosen variant is still at the
    base price. Showing "was 650" beside an 800 SAR variant would
    read as a discount that is not being given. */
 if(P.was&&unitPrice()===P.price){w.textContent=P.was.toLocaleString('en-US');w.classList.remove('hidden');}
 else w.classList.add('hidden');
 document.getElementById('pTag').textContent=L==='ar'?'سعر التجربة':'PILOT PRICE';
 document.getElementById('pVat').textContent=L==='ar'?'شامل الضريبة · توصيل مجاني داخل الرياض':'VAT included · free delivery inside Riyadh';

 const ow=document.getElementById('optGroups');
 if(P.opts.length){
  ow.classList.remove('hidden');
  ow.innerHTML=P.opts.map((g,gi)=>{
   const pick=picks[gi]||0;
   return '<div class="optgroup">'+
    '<div class="optlabel"><span>'+T(g)+'</span><span>'+T(g.items[pick])+'</span></div>'+
    '<div class="chips">'+g.items.map((it,i)=>
     '<button class="chip" data-g="'+gi+'" data-i="'+i+'" aria-pressed="'+(i===pick)+'">'+
     T(it)+(it.extra?'<small>'+it.extra+'</small>':'')+'</button>').join('')+'</div></div>';
  }).join('');
 } else ow.classList.add('hidden');

 document.getElementById('qVal').textContent=qty;
 document.getElementById('addBtn').textContent=L==='ar'?'أضف للسلة':'Add to cart';
 document.getElementById('buyNowBtn').textContent=L==='ar'?'اشترِ الآن':'Buy now';
 document.getElementById('stickyBuy').textContent=L==='ar'?'أضف للسلة':'Add to cart';
 document.getElementById('stickyName').innerHTML=P[L][0]+'<span>'+unitPrice()+' SAR</span>';
 /* The install note only belongs on the products that need one. */
 document.getElementById('reassure').innerHTML=(L==='ar'
  ?['إرجاع خلال ١٤ يوماً','ضمان سنتين',P.wired?'تركيب ١٥٠ ريالاً للمنزل':'لا يحتاج تركيباً']
  :['14-day return','2-year warranty',P.wired?'150 SAR install per home':'No installation needed'])
  .map(x=>'<span><b>◇</b> '+x+'</span>').join('');

 document.getElementById('specHead').textContent=L==='ar'?'المواصفات':'Specifications';
 document.getElementById('specList').innerHTML=P.spec.map(r=>
  '<div><dt>'+(SPECLAB[r[0]]?SPECLAB[r[0]][L]:r[0])+'</dt><dd>'+r[1]+'</dd></div>').join('');

 const faqs=(P.faq?P.faq[L]:[]).concat(COMMON_FAQ[L]);
 document.getElementById('faqHead').textContent=L==='ar'?'أسئلة':'Questions';
 document.getElementById('faqList').innerHTML=faqs.map(f=>
  '<details><summary>'+f[0]+'</summary><p>'+f[1]+'</p></details>').join('');
 document.querySelectorAll('.faq details').forEach(el=>
  el.addEventListener('toggle',()=>{if(el.open)track('faq_open');}));

 const rel=CATALOG.filter(x=>x.c===P.c&&x.id!==P.id).slice(0,3);
 document.getElementById('relHead').textContent=L==='ar'?'يتركّب معه عادة':'Usually fitted with this';
 document.getElementById('relList').innerHTML=rel.map(p=>
  '<a class="pcard" href="'+SLUG[p.id]+'" data-ev="related_'+p.id+'"><span class="g">'+p.g+'</span>'+
  '<h3>'+p[L][0]+'</h3><p>'+p[L][1]+'</p><div class="prow"><span class="price">'+p.price+' SAR</span><span class="arrow">→</span></div></a>').join('');

 /* demos */
 document.getElementById('demoLock').classList.toggle('hidden',P.demo!=='lock');
 document.getElementById('demoPlug').classList.toggle('hidden',P.demo!=='plug');
 if(P.demo==='lock'){
  document.getElementById('demoLockH').textContent=L==='ar'?'جرّبه — سوِّ رمز للعاملة':'Try it — make a code for the housekeeper';
  if(!code)document.getElementById('codeMsg').textContent=L==='ar'?'اضغط أربعة أرقام.':'Tap four digits.';
 }
 if(P.demo==='plug'){
  document.getElementById('demoPlugH').textContent=P.id==='ac'
   ?(L==='ar'?'كم يكلّفك الجهاز حالياً؟':'What is it costing you now?')
   :(L==='ar'?'كم يكلّفك الجهاز حالياً؟':'What is it costing you now?');
  renderMeter();
 }

 /* modal copy */
 document.getElementById('cartHead').textContent=L==='ar'?'سلتك':'Your cart';
 document.getElementById('totalLabel').textContent=L==='ar'?'الإجمالي':'Total';
 document.getElementById('checkoutBtn').textContent=L==='ar'?'إتمام الشراء':'Checkout';
 document.getElementById('closeCart').textContent=L==='ar'?'أكمل التصفح':'Keep looking';
 document.getElementById('doorHead').textContent=L==='ar'?'الدفعة الحالية محجوزة':'This batch is spoken for';
 document.getElementById('doorBody').textContent=L==='ar'
  ?'ننتج على دفعات من ٥٠ وحدة، وتُشحن الدفعة القادمة خلال ثلاثة أسابيع تقريباً. سجّل رقمك لتحصل على الأولوية مع تثبيت السعر التجريبي، ولا يُخصم منك شيء الآن.'
  :'We build in runs of 50. The next run ships in about three weeks. Leave your number and you get first pick with the pilot price held — nothing is charged now.';
 document.getElementById('dName').placeholder=L==='ar'?'الاسم':'Name';
 document.getElementById('doorSubmit').textContent=L==='ar'?'احجز لي وحدة':'Hold my unit';
 document.getElementById('closeDoor').textContent=L==='ar'?'لا شكراً':'No thanks';
 document.getElementById('thanksHead').textContent=L==='ar'?'محجوزة لك':'Held for you';
 document.getElementById('thanksBody').textContent=L==='ar'
  ?'أنت ضمن الدفعة القادمة، وسنراسلك فور شحنها. ولا دفع حتى ذلك الحين.'
  :"You're in the next run. We'll message you when it ships — no payment until then.";
 document.getElementById('closeThanks').textContent=L==='ar'?'إغلاق':'Close';
 document.getElementById('dWhen').innerHTML=(L==='ar'
  ?['أرغب بشرائه هذا الأسبوع','خلال شهر','أقارن حالياً فقط']
  :["I'd buy this week",'Within a month','Just comparing for now']).map(o=>'<option>'+o+'</option>').join('');

 bind();
}
function bind(){
 document.querySelectorAll('#optGroups .chip').forEach(c=>c.addEventListener('click',()=>{
  const g=+c.dataset.g;
  picks[g]=+c.dataset.i;
  track('variant_select',T(P.opts[g].items[picks[g]]));render();}));
}

/* meter demo */
function renderMeter(){
 document.getElementById('meterSel').innerHTML=APPLIANCES.map((a,i)=>
  '<button class="chip" data-i="'+i+'" aria-pressed="'+(i===appl)+'">'+T(a)+'</button>').join('');
 const a=APPLIANCES[appl],kwh=a.w*24*30*a.duty/1000;
 document.getElementById('meterV').textContent=Math.round(kwh*0.18);
 document.getElementById('meterNote').innerHTML=T(a.note)+' <span style="opacity:.6">≈ '+Math.round(kwh)+' kWh</span>';
 document.querySelectorAll('#meterSel .chip').forEach(c=>c.addEventListener('click',()=>{
  appl=+c.dataset.i;track('demo_used',APPLIANCES[appl].en);renderMeter();}));
}
/* keypad demo */
document.getElementById('keypad').innerHTML=[1,2,3,4,5,6,7,8,9,'✕',0,'✓'].map(n=>'<button>'+n+'</button>').join('');
document.querySelectorAll('#keypad button').forEach(b=>b.addEventListener('click',()=>{
 const v=b.textContent;
 if(v==='✕'){code='';}
 else if(v==='✓'){
  if(code.length===4){
   document.getElementById('codeMsg').innerHTML=lang==='ar'
    ?'الرمز <b>'+code+'</b> شغّال من الأحد للخميس، ٨ص – ٤م. يوقف تلقائياً بعد شهر.'
    :'Code <b>'+code+'</b> works Sunday to Thursday, 8am–4pm. It expires on its own in a month.';
   track('demo_used','code_set');}
  return;}
 else if(code.length<4)code+=v;
 document.getElementById('codeLine').textContent=code.replace(/./g,'●');
 if(code.length===4)document.getElementById('codeMsg').textContent=lang==='ar'?'اضغط ✓ لتفعيله.':'Press ✓ to activate.';}));

/* cart + fake door */
/* Charged once per home however many devices are ordered, which is
   why it is a separate line rather than part of each item. It only
   applies when something in the cart actually needs an electrician -
   a sensor that sits under a sink does not. */
const INSTALL_FEE=150;
function needsInstall(){
 return cart.some(l=>CATALOG.find(x=>x.id===l.id).wired);
}

/* A cart line stores the product id and which option was picked, not
   the finished text, so the cart re-reads correctly when the visitor
   switches language. */
function lineName(l){return CATALOG.find(x=>x.id===l.id)[lang][0];}
function lineVariant(l){
 const prod=CATALOG.find(x=>x.id===l.id);
 return prod.opts.map((g,i)=>T(g.items[l.picks[i]||0])).join(' · ');
}
function cartCount(){return cart.reduce((s,l)=>s+l.q,0);}
function updateBadge(){document.getElementById('cartCount').textContent=cartCount();}

function drawCart(){
 const L=lang;
 document.getElementById('cartLines').innerHTML=cart.map((l,i)=>{
  const variant=lineVariant(l);
  return '<div class="cartline">'+
   '<span class="cl-main"><b>'+lineName(l)+'</b>'+
     (variant?'<span class="cl-var">'+variant+'</span>':'')+'</span>'+
   '<span class="cl-qty"><button data-dec="'+i+'" aria-label="-">−</button>'+
     '<span>'+l.q+'</span>'+
     '<button data-inc="'+i+'" aria-label="+">+</button></span>'+
   '<b class="cl-amt">'+(l.price*l.q).toLocaleString('en-US')+' SAR</b>'+
   '<button class="cl-rm" data-rm="'+i+'" aria-label="'+(L==='ar'?'إزالة':'Remove')+'">×</button>'+
  '</div>';
 }).join('')+
 (needsInstall()?'<div class="cartfee"><span>'+
   (L==='ar'?'التركيب · مرة واحدة للمنزل':'Installation · once per home')+
   '</span><span>'+INSTALL_FEE+' SAR</span></div>':'');

 const goods=cart.reduce((s,l)=>s+l.price*l.q,0);
 const total=goods+(needsInstall()?INSTALL_FEE:0);
 document.getElementById('cartTotal').textContent=total.toLocaleString('en-US')+' SAR';
 updateBadge();

 document.querySelectorAll('#cartLines [data-rm]').forEach(btn=>btn.addEventListener('click',()=>{
  const l=cart[+btn.dataset.rm];
  track('cart_remove',lineName(l));
  cart.splice(+btn.dataset.rm,1);
  if(cart.length)drawCart(); else closeOverlay();
 }));
 document.querySelectorAll('#cartLines [data-inc]').forEach(btn=>btn.addEventListener('click',()=>{
  cart[+btn.dataset.inc].q++;track('cart_qty_change','+');drawCart();}));
 document.querySelectorAll('#cartLines [data-dec]').forEach(btn=>btn.addEventListener('click',()=>{
  const i=+btn.dataset.dec;
  if(cart[i].q>1){cart[i].q--;track('cart_qty_change','-');drawCart();}
  else{track('cart_remove',lineName(cart[i]));cart.splice(i,1);
       if(cart.length)drawCart(); else closeOverlay();}
 }));
}

function closeOverlay(){
 updateBadge();
 document.getElementById('overlay').classList.remove('show');
}

function openCart(){
 drawCart();
 document.getElementById('cartView').classList.remove('hidden');
 document.getElementById('doorView').classList.add('hidden');
 document.getElementById('thanksView').classList.add('hidden');
 document.getElementById('overlay').classList.add('show');
}

function addToCart(){
 /* Adding the same product in the same variant should raise the count
    on the line that is already there, not open a second identical one. */
 const key=P.id+'|'+P.opts.map((g,i)=>picks[i]||0).join('|');
 const existing=cart.find(l=>l.key===key);
 if(existing)existing.q+=qty;
 else cart.push({key:key,id:P.id,picks:P.opts.map((g,i)=>picks[i]||0),price:unitPrice(),q:qty});
 const label=P[lang][0]+(P.opts.length?' · '+chosen().map(it=>T(it)).join(' · '):'');
 updateBadge();
 track('add_to_cart',label+' ×'+qty);
 openCart();
}
function showDoor(){
 track('begin_checkout');
 document.getElementById('cartView').classList.add('hidden');
 document.getElementById('doorView').classList.remove('hidden');
 document.getElementById('overlay').classList.add('show');
}
document.getElementById('addBtn').addEventListener('click',addToCart);
document.getElementById('stickyBuy').addEventListener('click',addToCart);
document.getElementById('buyNowBtn').addEventListener('click',()=>{track('buy_now_click');addToCart();setTimeout(showDoor,150);});
document.getElementById('cartBtn').addEventListener('click',()=>{
 if(!cart.length){track('cart_open_empty');return;}track('cart_open');openCart();});
document.getElementById('checkoutBtn').addEventListener('click',showDoor);
document.getElementById('doorSubmit').addEventListener('click',()=>{
 const n=document.getElementById('dName').value.trim(),p=document.getElementById('dPhone').value.trim();
 if(!n||p.length<9){track('door_invalid');
  alert(lang==='ar'?'اكتب اسمك ورقمك.':'Add your name and number.');return;}
 track('intent_captured',document.getElementById('dWhen').value);
 document.getElementById('doorView').classList.add('hidden');
 document.getElementById('thanksView').classList.remove('hidden');});
['closeCart','closeDoor','closeThanks'].forEach(id=>document.getElementById(id).addEventListener('click',()=>{
 if(id==='closeDoor')track('door_abandoned');
 document.getElementById('overlay').classList.remove('show');}));
document.getElementById('overlay').addEventListener('click',e=>{
 if(e.target.id==='overlay')document.getElementById('overlay').classList.remove('show');});

/* misc */
document.getElementById('qPlus').addEventListener('click',()=>{qty++;render();track('qty_change',qty);});
document.getElementById('qMinus').addEventListener('click',()=>{if(qty>1){qty--;render();track('qty_change',qty);}});
document.querySelectorAll('.thumb').forEach(b=>b.addEventListener('click',()=>{
 document.querySelectorAll('.thumb').forEach(x=>x.setAttribute('aria-pressed','false'));
 b.setAttribute('aria-pressed','true');track(b.dataset.ev);}));
addEventListener('scroll',()=>document.getElementById('sticky').classList.toggle('show',scrollY>600));
document.addEventListener('click',e=>{const el=e.target.closest('[data-ev]');
 if(el&&el.dataset.ev.indexOf('related_')===0)track(el.dataset.ev);});
document.getElementById('langBtn').addEventListener('click',()=>{
 lang=lang==='en'?'ar':'en';
 SiteLang.apply(lang);
 render();track('lang_switch',lang);});
document.getElementById('panelBtn').addEventListener('click',()=>document.getElementById('panel').classList.add('open'));
document.getElementById('closePanel').addEventListener('click',()=>document.getElementById('panel').classList.remove('open'));

SiteLang.apply(lang);
render();drawFunnel();track('view_item');
</script>
</body>
</html>
