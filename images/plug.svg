<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
<defs>
<linearGradient id="b" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#16383a"/><stop offset="1" stop-color="#0a1f21"/></linearGradient>
<filter id="g" x="-50%" y="-50%" width="200%" height="200%">
<feGaussianBlur stdDeviation="6" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
.bd{fill:url(#b);stroke:#3c6d6b;stroke-width:2}
.ac{fill:none;stroke:#4FB8A8;stroke-width:2.5;stroke-linecap:round}
.dim{fill:none;stroke:#2E7A70;stroke-width:2;stroke-linecap:round}
.lt{fill:#E8F1EE;opacity:.86}
.sl{fill:#7E9895}
.am{fill:#E8A33D;filter:url(#g)}
.tl{fill:#4FB8A8}
.tx{fill:#E8F1EE;font-family:ui-monospace,monospace;font-weight:500}
</style>

<rect class="bd" x="130" y="80" width="140" height="140" rx="30"/>
<circle cx="200" cy="142" r="40" fill="#061a1b" stroke="#2E7A70" stroke-width="1.5"/>
<rect x="181" y="126" width="9" height="22" rx="4.5" class="lt"/>
<rect x="210" y="126" width="9" height="22" rx="4.5" class="lt"/>
<rect x="195" y="158" width="10" height="9" rx="4" class="sl"/>
<circle cx="200" cy="196" r="11" fill="none" stroke="#4FB8A8" stroke-width="2.5"/>
<path class="ac" d="M200 190v8"/>
<circle cx="246" cy="100" r="4.5" class="am"/>
</svg>
